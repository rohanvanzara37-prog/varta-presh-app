<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#060911" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="TREDAURA" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>TREDAURA — Institutional Multi-Market Trading Terminal</title>
    <meta
      name="description"
      content="TREDAURA dark obsidian institutional trading terminal featuring live Gold (XAU/USD), Bitcoin, Ethereum &amp; EUR/USD charts, Smart Money Concepts, live macro calendar, and Market Replay Academy."
    />
    <meta property="og:title" content="TREDAURA — Institutional Multi-Market Trading Terminal" />
    <meta
      property="og:description"
      content="Real-time Gold, Crypto &amp; Forex candlestick terminal with SMC structure, economic calendar, and Market Replay Academy."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&family=JetBrains+Mono:wght@500;600;700&family=Noto+Sans+Devanagari:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script
      src="https://unpkg.com/lightweight-charts@5.0.8/dist/lightweight-charts.standalone.production.js"
      crossorigin="anonymous"
      defer
    ></script>
    <style>
      html, body {
        width: 100%;
        max-width: 100vw;
        overflow-x: hidden;
        background-color: #060911;
        color: #FFFFFF;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        margin: 0;
        padding: 0;
        position: relative;
      }
      #root {
        width: 100%;
        max-width: 100vw;
        overflow-x: hidden;
        background-color: #060911;
        color: #FFFFFF;
      }
      * {
        box-sizing: border-box;
      }
      canvas, svg {
        max-width: 100%;
      }
      :fullscreen,
      :-webkit-full-screen,
      :-moz-full-screen,
      :fullscreen::backdrop,
      ::backdrop,
      ::-webkit-backdrop {
        background-color: #05070D;
        background: #05070D;
        color: #FFFFFF;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
