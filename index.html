<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#FFFFFF" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="TREDAURA" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>TREDAURA — Institutional Multi-Market Trading Terminal</title>
    <meta
      name="description"
      content="TREDAURA pure-white institutional trading terminal featuring live Gold (XAU/USD), Bitcoin, Ethereum &amp; EUR/USD charts, Smart Money Concepts, live macro calendar, and Market Replay Academy."
    />
    <meta property="og:title" content="TREDAURA — Institutional Multi-Market Trading Terminal" />
    <meta
      property="og:description"
      content="Real-time Gold, Crypto &amp; Forex candlestick terminal with SMC structure, economic calendar, and Market Replay Academy."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script
      src="https://unpkg.com/lightweight-charts@5.0.8/dist/lightweight-charts.standalone.production.js"
      crossorigin="anonymous"
      defer
    ></script>
    <style>
      /* 1. पक्का जीरो साइड-स्क्रॉल (Strict No Side-Scroll) */
      html, body {
        width: 100% !important;
        max-width: 100vw !important;
        overflow-x: hidden !important;
        background-color: #ffffff !important;
        color: #0f172a !important;
        margin: 0 !important;
        padding: 0 !important;
        position: relative !important;
      }
      #root {
        width: 100% !important;
        max-width: 100vw !important;
        overflow-x: hidden !important;
        background-color: #ffffff !important;
      }
      * {
        box-sizing: border-box !important;
      }
      /* 2. कस्टम डार्क कलर्स को सफेद करना */
      [class*="0B0E14"], [class*="0b0e14"], [class*="131722"], [class*="0B0E11"], [class*="161A25"], [class*="1E222D"],
      .bg-slate-950, .bg-slate-900, .bg-gray-950, .bg-gray-900, .bg-zinc-950, .bg-neutral-950, .bg-black {
        background-color: #ffffff !important;
        color: #0f172a !important;
        border-color: #e2e8f0 !important;
      }
      [class*="1A1F2E"], [class*="181C27"], .bg-slate-800, .bg-gray-800, .bg-zinc-900, .bg-zinc-800 {
        background-color: #f8fafc !important;
        color: #0f172a !important;
        border-color: #cbd5e1 !important;
      }
      .text-white, .text-slate-100, .text-slate-200, .text-slate-300, .text-gray-100, .text-gray-200 {
        color: #0f172a !important;
      }
      .text-slate-400, .text-gray-400 {
        color: #475569 !important;
      }
      canvas, svg {
        max-width: 100% !important;
      }
      :fullscreen,
      :-webkit-full-screen,
      :-moz-full-screen,
      :fullscreen::backdrop,
      ::backdrop,
      ::-webkit-backdrop {
        background-color: #ffffff !important;
        background: #ffffff !important;
        color: #0f172a !important;
      }
      /* Intro Animations */
      @keyframes pulseLogo {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.06); }
      }
      @keyframes loadBar {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(0%); }
      }
    </style>
  </head>
  <body>
    <!-- TREDAURA Clean White Intro Screen -->
    <div id="tredaura-intro" style="position:fixed; inset:0; background:#ffffff; display:flex; flex-direction:column; align-items:center; justify-content:center; z-index:999999; transition:opacity 0.5s ease;">
      <img src="/logo.png" alt="TREDAURA" style="width:95px; height:95px; border-radius:22px; box-shadow:0 10px 25px rgba(0,0,0,0.08); margin-bottom:18px; animation: pulseLogo 1.5s infinite;" />
      <h1 style="color:#0f172a; font-family:sans-serif; font-size:28px; font-weight:800; letter-spacing:4px; margin:0;">TREDAURA</h1>
      <p style="color:#059669; font-family:sans-serif; font-size:12px; font-weight:600; letter-spacing:2px; margin-top:8px;">SMART TRADING AI</p>
      <div style="width:140px; height:4px; background:#e2e8f0; border-radius:4px; margin-top:24px; overflow:hidden;">
        <div style="width:100%; height:100%; background:#059669; animation: loadBar 2.5s ease-in-out;"></div>
      </div>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <script>
      // काली Loading स्क्रीन को तुरंत हटाने का कोड
      const hideOldLoader = setInterval(() => {
        document.querySelectorAll('div').forEach(el => {
          if (el.id !== 'tredaura-intro' && el.innerText && el.innerText.includes('TRDAURA') && el.innerText.includes('Loading...')) {
            el.style.display = 'none';
          }
        });
      }, 50);

      // 2.5 सेकंड बाद सफेद इंट्रो हटाने का कोड
      window.addEventListener('load', () => {
        setTimeout(() => {
          const intro = document.getElementById('tredaura-intro');
          if (intro) {
            intro.style.opacity = '0';
            setTimeout(() => intro.remove(), 500);
          }
          clearInterval(hideOldLoader);
        }, 2500);
      });
    </script>
  </body>
</html>
